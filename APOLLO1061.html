<style>
  *{box-sizing:border-box}

  #panelTitle{font-size:14px;font-weight:900;letter-spacing:.08em;margin:0 0 8px 1px}
  #inputsGrid{display:grid;grid-template-columns:1fr;gap:7px;margin:7px 0}

<script>
(()=>{
'use strict';

/*
  APOLLO / ΕΑ runtime.
  Ο χάρτης που φορτώνεται εδώ είναι ήδη αποθηκευμένος στον χώρο ΕΑ.
  Η εφαρμογή χειρίζεται μόνο H/V, πλακίδια ΕΑ και τους 24 αναδρομικούς κύκλους.
*/

const ARCHIVE_BASE='greece_apollo.eatiles.';
const PART_SIZE=25165824;
const ARCHIVE_SIZE=471722928;
function archivePartName(i){return ARCHIVE_BASE+String(i+1).padStart(3,'0')}
const MAGIC='EATILE01';
const ENTRY_SIZE=21;
const LEVELS24=24, VP=800, HP=1260, TIE=1e-12;
const IONIAN={
 'Α':1,'Β':2,'Γ':3,'Δ':4,'Ε':5,'Ζ':7,'Η':8,'Θ':9,'Ι':10,'Κ':20,'Λ':30,'Μ':40,
 'Ν':50,'Ξ':60,'Ο':70,'Π':80,'Ρ':100,'Σ':200,'Τ':300,'Υ':400,'Φ':500,'Χ':600,'Ψ':700,'Ω':800
};
const NAMES={
 'Α':532,'Β':311,'Γ':85,'Δ':340,'Ε':865,'Ζ':316,'Η':309,'Θ':318,'Ι':1111,'Κ':182,'Λ':76,
 'Μ':50,'Ν':60,'Ξ':70,'Ο':360,'Π':90,'Ρ':170,'Σ':254,'Τ':701,'Υ':1260,'Φ':510,'Χ':610,'Ψ':710,'Ω':849
};
const SELFTEST=[
 {v:570.6949209383512,h:0,V:'ΧΥΦΨΤΣΝΦΠΣΣΦΦΡΧΧΧΧΧΧΧΧΧΧ',H:'ΥΖΦΜΠΨΟΥΕΑΚΡΣΤΗΟΨΙΡΖΡΕΨΥ'},
 {v:581.1480391613029,h:4.765613999999999,V:'ΧΥΥΝΤΡΧΩΣΚΥΛΧΤΤΡΤΤΩΧΩΨΤΦ',H:'ΥΣΨΙΣΤΕΕΕΧΡΦΩΣΧΣΦΥΨΙΤΡΣΨ'},
 {v:570.355271680515,h:1258.0104075000002,V:'ΧΥΦΠΨΣΨΚΒΩΡΥΥΥΣΦΧΣΨΥΤΧΤΧ',H:'ΥΔΩΥΧΨΤΞΠΧΜΥΕΠΧΦΦΡΕΣΠΙΧΜ'}
];

const mod=(x,p)=>{const r=x%p;return r<0?r+p:r};
const close=(a,b)=>Math.abs(a-b)<=TIE;
function cdist(a,b,p){const d=mod(Math.abs(a-b),p);return Math.min(d,p-d)}
function linearZone(x,anchors){
 const items=Object.entries(anchors).sort((a,b)=>a[1]-b[1]);
 const vals=items.map(v=>v[1]);
 const ds=vals.map(v=>Math.abs(x-v));
 const m=Math.min(...ds), tied=[];
 ds.forEach((d,i)=>{if(close(d,m))tied.push(i)});
 if(tied.length!==1)throw new Error('EA linear boundary');
 const i=tied[0],[letter,value]=items[i];
 const lo=i===0?vals[0]:(vals[i-1]+value)/2;
 const hi=i===items.length-1?vals[vals.length-1]:(value+vals[i+1])/2;
 return {letter,value,lo,hi};
}
function circularZone(phase,anchors,period,rotation){
 phase=mod(phase,period);
 const pts=Object.entries(anchors).map(([letter,value])=>({q:mod(value-rotation,period),letter,value})).sort((a,b)=>a.q-b.q);
 const ds=pts.map(p=>cdist(phase,p.q,period)),m=Math.min(...ds),tied=[];
 ds.forEach((d,i)=>{if(close(d,m))tied.push(i)});
 if(tied.length!==1)throw new Error('EA circular boundary');
 const i=tied[0],p=pts[i];
 const prev=i?pts[i-1].q:pts[pts.length-1].q-period;
 const next=i<pts.length-1?pts[i+1].q:pts[0].q+period;
 const lo=(prev+p.q)/2,hi=(p.q+next)/2;
 let u=phase;while(u<lo)u+=period;while(u>=hi)u-=period;
 return {...p,lo,hi,u};
}
function vertical24(x){
 const physical={...IONIAN,'Υ':400.5};
 let z=linearZone(x,physical);
 let phase=VP*(z.hi-x)/(z.hi-z.lo),rotation=IONIAN[z.letter],code=z.letter;
 for(let k=2;k<=LEVELS24;k++){
   z=circularZone(phase,IONIAN,VP,rotation);code+=z.letter;
   phase=VP*(z.hi-z.u)/(z.hi-z.lo);rotation=IONIAN[z.letter];
 }
 return code;
}
function horizontal24(phase){
 let z=circularZone(phase,NAMES,HP,0),code=z.letter;
 phase=HP*(z.hi-z.u)/(z.hi-z.lo);let rotation=z.value;
 for(let k=2;k<=LEVELS24;k++){
   z=circularZone(phase,NAMES,HP,rotation);code+=z.letter;
   phase=HP*(z.hi-z.u)/(z.hi-z.lo);rotation=z.value;
 }
 return code;
}
for(const t of SELFTEST){
 if(vertical24(t.v)!==t.V||horizontal24(t.h)!==t.H){fatal('Σφάλμα εσωτερικού ελέγχου ΕΑ.');return}
}


// ---------------------------------------------------------------------------
// APOLLO G — exact EA24 inverse cell decoder + internal G ellipsoid.
// Port of the frozen APOLLO G V2.1 distance kernel.
// IMPORTANT: no Apollo anchoring preamble runs here. The runtime consumes EA24.
// ---------------------------------------------------------------------------
const G_CORE_ID='APOLLO_G_JS_RUNTIME_FROM_V2_1_2026-09-08';
const FLATTENING_G=0.003352819468541, EQUATOR_V_G=400.5, G_PER_V=2.0, QUARTER_MERIDIAN_G=799.0;
const G_ALPHABET='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
function bgcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const t=a%b;a=b;b=t}return a||1n}
function R(n,d=1n){n=BigInt(n);d=BigInt(d);if(d===0n)throw new Error('Μηδενικός παρονομαστής.');if(d<0n){n=-n;d=-d}const g=bgcd(n,d);return {n:n/g,d:d/g}}
const R0=R(0n),R2=R(2n),VP_R=R(800n),HP_R=R(1260n);
function radd(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d)}
function rsub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d)}
function rmul(a,b){return R(a.n*b.n,a.d*b.d)}
function rdiv(a,b){if(b.n===0n)throw new Error('Διαίρεση με μηδέν.');return R(a.n*b.d,a.d*b.n)}
function rcmp(a,b){const x=a.n*b.d,y=b.n*a.d;return x<y?-1:x>y?1:0}
function rmin(a,b){return rcmp(a,b)<=0?a:b}function rmax(a,b){return rcmp(a,b)>=0?a:b}
function rfloor(a){return a.n>=0n?a.n/a.d:-((-a.n+a.d-1n)/a.d)}
function rmod(a,p){const q=rfloor(rdiv(a,p));return rsub(a,rmul(R(q),p))}
function rnum(a){return Number(a.n)/Number(a.d)}
function ratMap(obj){const o={};for(const [k,v] of Object.entries(obj))o[k]=R(BigInt(v));return o}
const IONIAN_R=ratMap(IONIAN),NAMES_R=ratMap(NAMES);
function validateEA24(code,label){code=String(code||'').normalize('NFC');if(Array.from(code).length!==24)throw new Error(`${label}: απαιτούνται ακριβώς 24 γράμματα.`);for(const ch of code)if(!G_ALPHABET.includes(ch))throw new Error(`${label}: μη επιτρεπτό γράμμα «${ch}».`);return code}
function mergeIntervals(intervals){const items=intervals.slice().sort((a,b)=>{const c=rcmp(a[0],b[0]);return c||rcmp(a[1],b[1])});if(!items.length)return[];const out=[[items[0][0],items[0][1]]];for(let i=1;i<items.length;i++){const [lo,hi]=items[i],last=out[out.length-1];if(rcmp(lo,last[1])<=0){if(rcmp(hi,last[1])>0)last[1]=hi}else out.push([lo,hi])}return out}
function linearBounds(letter,anchors){const items=Object.entries(anchors).sort((a,b)=>rcmp(a[1],b[1])),i=items.findIndex(x=>x[0]===letter);if(i<0)throw new Error('Άγνωστο γράμμα.');const value=items[i][1],lower=i===0?items[0][1]:rdiv(radd(items[i-1][1],value),R2),upper=i===items.length-1?items[items.length-1][1]:rdiv(radd(value,items[i+1][1]),R2);return[lower,upper]}
function circularBounds(letter,anchors,period,rotation){const points=Object.entries(anchors).map(([ch,value])=>({q:rmod(rsub(value,rotation),period),ch,value})).sort((a,b)=>{const c=rcmp(a.q,b.q);return c||a.ch.localeCompare(b.ch)}),i=points.findIndex(p=>p.ch===letter);if(i<0)throw new Error('Άγνωστο γράμμα.');const q=points[i].q,prev=i?points[i-1].q:rsub(points[points.length-1].q,period),next=i<points.length-1?points[i+1].q:radd(points[0].q,period);return[rdiv(radd(prev,q),R2),rdiv(radd(q,next),R2)]}
function rawIntervalsFromUnwrapped(lo,hi,period){const out=[],k0=Number(rfloor(rdiv(lo,period))-2n),k1=Number(rfloor(rdiv(hi,period))+2n);for(let k=k0;k<=k1;k++){const kp=rmul(R(BigInt(k)),period),a=rmax(R0,rsub(lo,kp)),b=rmin(period,rsub(hi,kp));if(rcmp(b,a)>0)out.push([a,b])}return mergeIntervals(out)}
function backStep(nextRaw,lo,hi,period){const width=rsub(hi,lo),out=[];for(const[a,b]of nextRaw){const pLo=rsub(hi,rmul(rdiv(b,period),width)),pHi=rsub(hi,rmul(rdiv(a,period),width));out.push(...rawIntervalsFromUnwrapped(pLo,pHi,period))}return mergeIntervals(out)}
function inverseVerticalCell(code){code=validateEA24(code,'V24');const physical={...IONIAN_R,'Υ':R(801n,2n)},zones=[linearBounds(code[0],physical)];for(let i=1;i<code.length;i++)zones.push(circularBounds(code[i],IONIAN_R,VP_R,IONIAN_R[code[i-1]]));let current=rawIntervalsFromUnwrapped(zones[zones.length-1][0],zones[zones.length-1][1],VP_R);for(let i=code.length-2;i>0;i--)current=backStep(current,zones[i][0],zones[i][1],VP_R);const[lo,hi]=zones[0],width=rsub(hi,lo),out=[];for(const[a,b]of current){out.push([rsub(hi,rmul(rdiv(b,VP_R),width)),rsub(hi,rmul(rdiv(a,VP_R),width))])}return mergeIntervals(out)}
